[project]
name = "coding-distillation"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.56",
    "datasets>=3.0",
    "peft>=0.13",
    "trl>=0.20",
    "accelerate>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distill"]
